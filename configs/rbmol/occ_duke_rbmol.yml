MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  PRETRAIN_PATH: './pretrained/jx_vit_base_p16_224-80ecf9dd.pth'
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'vit_base_patch16_224_TransReID'
  STRIDE_SIZE: [11, 11]
  SIE_CAMERA: True
  SIE_COE: 3.0
  JPM: True
  RE_ARRANGE: True

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]
  RB_MOL:
    ENABLED: True
    PROB: 0.5
    AREA_RANGE: [0.15, 0.35]
    ASPECT_RANGE: [0.3, 3.3]
    BLEND_ALPHA: 1.0
    OCC_REID_WEIGHT: 0.5
    CONSISTENCY_WEIGHT: 0.02
    CONSISTENCY_WARMUP_EPOCHS: 0
    EMA_MOMENTUM: 0.999
    CONSISTENCY_FEATURE: 'global'
    CONSISTENCY_TEMP: 0.07
    PROTOTYPE_MOMENTUM: 0.9
    RELIABILITY_TEMP: 0.2
    RELIABILITY_ALPHA: 0.2
    RELIABILITY_ID_WEIGHT: 0.5
    RELIABILITY_STABILITY_WEIGHT: 0.5
    RELIABILITY_TOPK_RATIO: 0.5
    RELIABILITY_TOPK_MIN_TOKENS: 4
    REGION_BALANCED_SPLITS: [0.0, 0.35, 0.70, 1.0]
    REGION_BALANCED_MIN_TOKENS: 1
    MASK_AWARE_RELIABILITY: True
    MASK_AWARE_WEIGHT: 1.0
    MASK_AWARE_VISIBLE_ONLY: True
    MASK_AWARE_VISIBLE_THRESHOLD: 0.5
    MASK_AWARE_PATCH_SIZE: 16
    AVOID_SAME_ID: True
    SOURCE_MODE: 'edge'
    TARGET_MODE: 'body'
    EDGE_RATIO: 0.2
    BODY_X_RANGE: [0.2, 0.8]
    BODY_Y_RANGE: [0.15, 0.85]

DATASETS:
  NAMES: ('occ_duke')
  ROOT_DIR: ('./data')

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  OPTIMIZER_NAME: 'SGD'
  MAX_EPOCHS: 120
  BASE_LR: 0.008
  IMS_PER_BATCH: 64
  WARMUP_METHOD: 'linear'
  LARGE_FC_LR: False
  CHECKPOINT_PERIOD: 120
  LOG_PERIOD: 50
  EVAL_PERIOD: 120
  WEIGHT_DECAY:  1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  BIAS_LR_FACTOR: 2

TEST:
  EVAL: True
  IMS_PER_BATCH: 256
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: './logs/occ_duke_vit_transreid_stride_rbmol_edge_body_prototype_region_balanced_maskaware_reliability'
